<!doctype html>
<html>
<head>

<style>
  html, body { margin: 0; padding: 0; }
  body { font-family: 'Space Grotesk', 'Trebuchet MS', sans-serif; width: 750px; height: 496px; overflow: hidden; }
</style>
</head>
<body>
<div style="width: 750px; height: 496px; background: #f7f6f2; position: relative; overflow: hidden">
  <svg width="750" height="496" viewBox="0 0 750 496" style="position: absolute; inset: 0" aria-hidden="true">
    <g stroke="#e9e7df" stroke-width="1">
      <line x1="0" y1="62" x2="750" y2="62"></line>
      <line x1="0" y1="124" x2="750" y2="124"></line>
      <line x1="0" y1="186" x2="750" y2="186"></line>
      <line x1="0" y1="248" x2="750" y2="248"></line>
      <line x1="0" y1="310" x2="750" y2="310"></line>
      <line x1="0" y1="372" x2="750" y2="372"></line>
      <line x1="0" y1="434" x2="750" y2="434"></line>
      <line x1="94" y1="0" x2="94" y2="496"></line>
      <line x1="188" y1="0" x2="188" y2="496"></line>
      <line x1="282" y1="0" x2="282" y2="496"></line>

    <g fill="#f7f6f2" stroke="#1c2733" stroke-width="3">
      <circle cx="640" cy="60" r="6"></circle>
      <circle cx="560" cy="110" r="6"></circle>
      <circle cx="590" cy="190" r="6"></circle>
      <circle cx="520" cy="240" r="6"></circle>
      <circle cx="560" cy="320" r="6"></circle>
      <circle cx="500" cy="380" r="6"></circle>
    </g>
    <circle cx="560" cy="450" r="8" fill="#e8590c" stroke="#1c2733" stroke-width="3"></circle>
    <g font-family="Space Grotesk, sans-serif" font-size="11" fill="#9aa1ab">
      <text x="652" y="56">A1</text>
      <text x="600" y="188">A3</text>
      <text x="572" y="324">A5</text>
    </g>
  </svg>
  <div style="position: absolute; left: 56px; top: 150px; display: flex; flex-direction: column; gap: 14px">
    <svg width="88" height="88" viewBox="0 0 120 120">
      <polyline points="92,24 50,16 20,44 18,78 48,106 92,96" fill="none" stroke="#1c2733" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"></polyline>

        <circle cx="50" cy="16" r="7"></circle>

    <div style="font-size: 15px; font-weight: 500; letter-spacing: 4px; color: #6b7480; text-transform: uppercase">Cave Survey CAD</div>
    <div style="font-size: 13px; font-weight: 400; color: #9aa1ab">Based on QCAD · qcad.org</div>
  </div>
  <!-- The version number is NOT part of this artwork. CaveCAD paints it
       into the lower right corner at start up (drawSplashVersion() in
       scripts/autostart.js), so a version bump needs no re-render. The
       space it occupies: right 28px, bottom 22px, 26px bold #1c2733. -->
</div>

</html>
