name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [cavecad]

env:
  QT_VERSION: 6.11.1
  QT_ARCH: win64_msvc2022_64
  QTJSAPI_REV: c82731320fdc7b61dae56d4cf046bac9376bb2b4
  QCADJSAPI_REV: 2b2b0e86328416dc57ca57a035e10d5dfd919db6

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Qt ${{ env.QT_VERSION }}
        shell: cmd
        run: |
          pip install aqtinstall
          aqt install-qt windows desktop %QT_VERSION% %QT_ARCH% -m qt5compat -O %GITHUB_WORKSPACE%\Qt

      - name: Install Ninja
        shell: cmd
        run: choco install ninja -y --no-progress

      - name: Fetch JS API sources
        shell: cmd
        working-directory: ${{ github.workspace }}\..
        run: |
          rem qcadjsapi expects the CaveCAD tree as a sibling directory named "cavecad"
          if not exist cavecad mklink /J cavecad "%GITHUB_WORKSPACE%"
          git clone -q https://github.com/qcad/qtjsapi.git qtjsapi
          git -C qtjsapi checkout -q %QTJSAPI_REV%
          git clone -q https://github.com/qcad/qcadjsapi.git qcadjsapi
          git -C qcadjsapi checkout -q %QCADJSAPI_REV%
          git -C qcadjsapi apply --verbose "%GITHUB_WORKSPACE%\tools\qcadjsapi-cavecad.patch"

      - name: Build CaveCAD
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\.github\vcvars.cmd" || exit /b 1
          set QTDIR=%GITHUB_WORKSPACE%\Qt\%QT_VERSION%\msvc2022_64
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_QT6=ON -DCMAKE_PREFIX_PATH=%QTDIR%
          if errorlevel 1 exit /b 1
          cmake --build build
          if errorlevel 1 exit /b 1

      - name: Build qtjsapi
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\.github\vcvars.cmd" || exit /b 1
          set QTDIR=%GITHUB_WORKSPACE%\Qt\%QT_VERSION%\msvc2022_64
          cmake -S ..\qtjsapi -B ..\qtjsapi\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%QTDIR%
          if errorlevel 1 exit /b 1
          cmake --build ..\qtjsapi\build
          if errorlevel 1 exit /b 1
          rem qcadjsapi links against qtjsapi via the CaveCAD release directory
          copy /Y ..\qtjsapi\build\out\qtjsapi.dll release\ >nul
          copy /Y ..\qtjsapi\build\out\qtjsapi.lib release\ >nul

      - name: Build cavecadjsapi plugin
        shell: cmd
        run: |
          call "%GITHUB_WORKSPACE%\.github\vcvars.cmd" || exit /b 1
          set QTDIR=%GITHUB_WORKSPACE%\Qt\%QT_VERSION%\msvc2022_64
          cmake -S ..\qcadjsapi -B ..\qcadjsapi\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=%QTDIR%
          if errorlevel 1 exit /b 1
          cmake --build ..\qcadjsapi\build
          if errorlevel 1 exit /b 1

      - name: Package
        shell: cmd
        run: |
          set QTDIR=%GITHUB_WORKSPACE%\Qt\%QT_VERSION%\msvc2022_64
          for %%d in (scripts libraries patterns linetypes fonts themes ts plugins defaults) do (
            if exist %%d xcopy /E /I /Y /Q %%d release\%%d >nul
          )
          rem deploy Qt for the executable and for every CaveCAD library / plugin
          for %%f in (release\cavecad.exe release\*.dll release\plugins\*.dll) do (
            "%QTDIR%\bin\windeployqt.exe" --release --dir release %%f || exit /b 1
          )
          del /Q release\*.exp release\*.lib 2>nul
          del /Q release\plugins\*.exp release\plugins\*.lib 2>nul

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: cavecad-windows-x64
          path: release/

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: ignore
